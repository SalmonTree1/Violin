<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violin</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Violin | Peer-ranked music leaderboard</h1>

        <!-- submit form -->
        <form id="submit-form" class="submit-form">
            <input type="text" id="spotify-url" placeholder="Paste Spotify Track Link..." required>
            <input type="text" id="ig-handle" placeholder="Your IG Handle (Optional)">
            <button type="submit" id="submit-btn">Drop Song</button>
        </form>

        <!-- status message -->
        <p id="status-msg"></p>

        <!-- leaderboard -->
        <h2>Top songs today</h2>
        <div id="leaderboard-list">
            <p class="muted">Loading top songs...</p>
        </div>
    </main>
</body>
</html>
